name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run fmt:check

      - name: Typecheck server + UI
        run: npm run build:check

      - name: Typecheck garmin-connect
        run: npm run typecheck:lib

      - name: Test garmin-connect
        run: npm run test:lib

      - name: Test MCP tools
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack and validate the ChatGPT plugin
        run: node scripts/pack-chatgpt-plugin.mjs && node scripts/validate-chatgpt-plugin.mjs

      # Self-hosted Worker: in workerd through OAuth and MCP, against a fake Garmin
      - name: Test the self-hosted Worker
        run: npm run test:worker
        env:
          WRANGLER_SEND_METRICS: "false"

      # The Workers free plan takes scripts up to 3 MB gzipped (app.html is a static asset)
      - name: Worker bundle size
        run: |
          npx wrangler deploy --dry-run --env "" --outdir "$RUNNER_TEMP/worker"
          size=$(gzip -c "$RUNNER_TEMP/worker/index.js" | wc -c)
          echo "Worker script: $((size / 1024)) KiB gzipped"
          test "$size" -lt 3145728
        env:
          WRANGLER_SEND_METRICS: "false"

  # Merge Dependabot patch/minor updates once CI passes. Majors need review.
  dependabot-automerge:
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
