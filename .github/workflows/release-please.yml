name: Release

on:
  push:
    branches: [main]
  # Re-publish the current version to npm (skipped if already there) and the
  # MCP Registry, e.g. after the registry step failed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pack:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mcpb
        run: npm install -g @anthropic-ai/mcpb

      - name: Build and pack
        run: npm run pack

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: garmin-mcp-app.mcpb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm package, so any MCP client can run `npx -y garmin-mcp-app`, then its
  # server.json to the MCP Registry (which checks the package's `mcpName`, so
  # npm goes first). Both use OIDC: no NPM_TOKEN secret; the npm trusted
  # publisher (this repo + release-please.yml) is configured on npmjs.com.
  npm-and-registry:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "garmin-mcp-app@$version" version >/dev/null 2>&1; then
            echo "garmin-mcp-app@$version is already on npm"
          else
            npm publish --access public
          fi

      # The registry checks the version exists on npm, which can take minutes to show up
      - name: Wait for the npm release
        run: |
          version=$(node -p 'require("./package.json").version')
          for i in $(seq 1 40); do
            npm view "garmin-mcp-app@$version" version >/dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "garmin-mcp-app@$version did not show up on npm in 20 minutes" >&2
          exit 1

      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # ChatGPT / Codex plugin: publish the ready-built marketplace to the
  # `chatgpt-plugin` branch, so users can run
  #   codex plugin marketplace add chenhunghan/garmin-mcp-app@chatgpt-plugin
  chatgpt-plugin:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run pack:chatgpt

      - name: Publish to the chatgpt-plugin branch
        working-directory: build/chatgpt-plugin
        run: |
          git init -q -b chatgpt-plugin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chatgpt plugin ${{ needs.release-please.outputs.tag_name }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" chatgpt-plugin
